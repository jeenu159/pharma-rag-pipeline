name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pharma-rag-api .

  smoke-eval:
    name: Retrieval smoke eval
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: pharma_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d pharma_smoke"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: host=localhost port=5432 dbname=pharma_smoke user=rag password=rag
      EVAL_FILE: eval/smoke.jsonl
      MIN_RECALL5: "0.9"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: pip install -r requirements-api.txt

      - name: Restore fixture database
        run: >-
          docker run --rm --network host
          -v ${{ github.workspace }}/tests/fixtures:/fixtures
          -e PGPASSWORD=rag
          pgvector/pgvector:pg17
          pg_restore -h localhost -U rag -d pharma_smoke --no-owner /fixtures/smoke.dump

      - name: Run smoke eval (fails the build if recall@5 < 0.9)
        run: python src/eval_retrieval.py

      - name: Save eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results
          path: eval/runs/retrieval_*.json